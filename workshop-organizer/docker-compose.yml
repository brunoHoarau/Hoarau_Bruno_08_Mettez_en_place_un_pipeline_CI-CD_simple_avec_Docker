# Rotation des logs Docker commune aux services : 3 fichiers de 10 Mo maximum
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:13
    container_name: workshop-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password

    secrets:
      - db_password

    # Exposé uniquement sur la machine hôte (administration, sauvegardes), pas sur le réseau
    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    logging: *default-logging

  app:
    build: .
    image: workshop-organizer:latest
    container_name: workshop-app
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}

    # Même secret que la base : lu par entrypoint.sh au démarrage
    secrets:
      - db_password

    ports:
      - "8080:8080"

    # L'API répond sur /api/notions dès que Spring Boot est démarré et connecté à PostgreSQL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/api/notions"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    logging: *default-logging

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  db-data:
