name: CI

# Workflow générique : un seul fichier pour l'application Angular et l'application Java.
#   changes      → liste des applications impactées et type de projet (node / java)
#   test         → tests unitaires + rapport JUnit, une exécution par application (matrice)
#   secrets-scan → détection de secrets dans le code et l'historique (Gitleaks)
#   build        → build + smoke test de l'image, par application, en parallèle des tests
#   publish      → push sur GHCR de l'image testée, seulement si tests, scan et smoke test sont verts

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      application:
        description: "Application à traiter"
        type: choice
        default: toutes
        options:
          - toutes
          - olympic-games-starter
          - workshop-organizer

# Une nouvelle exécution sur la même branche annule la précédente (sauf sur main : publication)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Paramètres centralisés
env:
  NODE_VERSION: "22"      # Angular 20 requiert Node ^20.19 || ^22.12
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: temurin
  REPORTS_DIR: test-results
  GITLEAKS_VERSION: "8.24.0"
  REGISTRY: ghcr.io
  SMOKE_PORT: "8080"      # port local utilisé pour tester l'image

# Moindre privilège par défaut ; chaque job n'élargit que ce dont il a besoin
permissions:
  contents: read

jobs:
  # ---------- Sélection des applications impactées et détection de leur type ----------
  changes:
    name: Détection des applications modifiées
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read    # lecture des fichiers modifiés d'une PR
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Le script de test et le workflow sont partagés : leur modification relance les deux applications
      - name: Filtrage par chemins
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            olympic-games-starter:
              - "olympic-games-starter/**"
              - "run-tests.sh"
              - ".github/workflows/ci.yml"
            workshop-organizer:
              - "workshop-organizer/**"
              - "run-tests.sh"
              - ".github/workflows/ci.yml"

      # Produit la matrice [{app, type}] :
      #   - lancement manuel : l'application choisie (ou toutes) ;
      #   - push sur main    : toujours les deux applications (version livrée entièrement validée) ;
      #   - sinon            : seulement les applications modifiées.
      # Même règle de détection du type que run-tests.sh.
      - name: Construction de la matrice
        id: select
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CHANGED: ${{ steps.filter.outputs.changes }}
          CHOICE: ${{ inputs.application }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ "$CHOICE" == "toutes" ]]; then
              apps='["olympic-games-starter","workshop-organizer"]'
            else
              apps="[\"$CHOICE\"]"
            fi
          elif [[ "$EVENT" == "push" && "$REF" == "refs/heads/main" ]]; then
            apps='["olympic-games-starter","workshop-organizer"]'
          else
            apps="$CHANGED"
          fi
          entries=()
          for app in $(jq -r '.[]' <<< "$apps"); do
            if [[ -f "$app/build.gradle" && -f "$app/gradlew" ]]; then
              type=java
            elif [[ -f "$app/package.json" ]]; then
              type=node
            else
              echo "::error::Type de projet non reconnu dans $app"
              exit 1
            fi
            entries+=("{\"app\":\"$app\",\"type\":\"$type\"}")
          done
          matrix="[$(IFS=,; echo "${entries[*]}")]"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Matrice : $matrix"

  # ---------- Tests unitaires + rapport JUnit ----------
  test:
    name: Tests - ${{ matrix.app }}
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write          # publication du rapport JUnit dans l'onglet Checks
    strategy:
      fail-fast: false       # l'échec d'une application n'interrompt pas l'autre
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      APP_DIR: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Chaîne Node / Angular (cache ~/.npm indexé sur package-lock.json) ---
      - name: Installation de Node.js
        if: matrix.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Installation des dépendances npm
        if: matrix.type == 'node'
        working-directory: ${{ env.APP_DIR }}
        run: npm ci --prefer-offline --no-audit --no-fund

      # --- Chaîne Java / Gradle (cache des dépendances et du wrapper Gradle) ---
      - name: Installation du JDK
        if: matrix.type == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configuration de Gradle (cache)
        if: matrix.type == 'java'
        uses: gradle/actions/setup-gradle@v4

      # --- Exécution commune : run-tests.sh s'adapte au type de projet ---
      - name: Exécution des tests
        run: |
          chmod +x ./run-tests.sh
          ./run-tests.sh "$APP_DIR"

      # Rapport visible dans l'onglet Checks, en annotations et dans le résumé du workflow
      - name: Publication du rapport JUnit
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: ${{ env.REPORTS_DIR }}/${{ matrix.app }}/*.xml
          check_name: Rapport de tests - ${{ matrix.app }}
          detailed_summary: true
          include_passed: true

      - name: Archivage des rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.app }}
          path: ${{ env.REPORTS_DIR }}/${{ matrix.app }}/
          if-no-files-found: warn
          retention-days: 14

  # ---------- Sécurité : détection de secrets dans le code et l'historique (TS-04) ----------
  # Indépendant des applications : lancé une seule fois, en parallèle des tests
  secrets-scan:
    name: Scan des secrets (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installation de Gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Échoue si un secret est détecté ; --redact masque les valeurs trouvées dans les logs
      # et le rapport. Faux positifs : commentaire « gitleaks:allow » sur la ligne concernée.
      - name: Analyse Gitleaks
        run: gitleaks git . --redact --verbose --no-banner --report-format json --report-path gitleaks-report.json

      - name: Archivage du rapport Gitleaks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 14

  # ---------- Build et validation de l'image (en parallèle des tests) ----------
  # Ne publie rien : l'image testée est transmise au job publish sous forme d'artefact
  build:
    name: Build & smoke test Docker - ${{ matrix.app }}
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      APP_DIR: ${{ matrix.app }}
      IMAGE_NAME: ${{ github.repository }}/${{ matrix.app }}   # mis en minuscules par metadata-action
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Labels OCI (source, révision…) posés dès le build : l'image publiée est celle construite ici
      - name: Calcul des labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # 1) Build chargé dans le démon Docker local pour pouvoir le tester.
      # SKIP_TESTS=true (image Java) : les tests sont déjà exécutés par le job test.
      - name: Build de l'image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          load: true
          tags: app:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.type == 'java' && 'SKIP_TESTS=true' || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # 2a) Validation front : l'image démarre et Nginx sert bien l'application Angular
      - name: Test de l'image (smoke test Angular)
        if: matrix.type == 'node'
        run: |
          docker run -d --name smoke -p "${SMOKE_PORT}:80" app:ci
          for _ in $(seq 1 15); do
            if curl -fsS "http://localhost:${SMOKE_PORT}/" | grep -q "<app-root"; then
              echo "Application servie correctement"
              exit 0
            fi
            sleep 2
          done
          echo "L'application ne répond pas" >&2
          docker logs smoke
          exit 1

      # 2b) Validation back : l'application démarre, se connecte à PostgreSQL et répond sur l'API.
      # Le mot de passe vient du secret de dépôt CI_DB_PASSWORD, limité à cette seule étape.
      # Il est transmis aux conteneurs par « -e NOM » (sans valeur) : il n'apparaît jamais
      # dans une ligne de commande, et GitHub le masque (***) dans les logs.
      - name: Test de l'image (smoke test Java + PostgreSQL)
        if: matrix.type == 'java'
        env:
          POSTGRES_DB: workshopsdb
          POSTGRES_USER: workshops_user
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          SPRING_DATASOURCE_USERNAME: workshops_user
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          if [[ -z "$POSTGRES_PASSWORD" ]]; then
            echo "::error::Secret CI_DB_PASSWORD non défini (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          docker network create smoke-net
          docker run -d --name smoke-db --network smoke-net \
            -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD postgres:13
          # Test en TCP : ignore le serveur temporaire d'initialisation (socket Unix seulement)
          for _ in $(seq 1 30); do
            docker exec smoke-db pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" && break
            sleep 2
          done
          docker run -d --name smoke --network smoke-net -p "${SMOKE_PORT}:8080" \
            -e SPRING_DATASOURCE_URL="jdbc:postgresql://smoke-db:5432/${POSTGRES_DB}" \
            -e SPRING_DATASOURCE_USERNAME -e SPRING_DATASOURCE_PASSWORD \
            app:ci
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://localhost:${SMOKE_PORT}/api/notions"; then
              echo "API opérationnelle"
              exit 0
            fi
            sleep 3
          done
          echo "L'application ne répond pas" >&2
          docker logs smoke
          exit 1

      - name: Arrêt des conteneurs de test
        if: always()
        run: |
          docker rm -f smoke smoke-db 2>/dev/null || true
          docker network rm smoke-net 2>/dev/null || true

      # 3) Export de l'image testée, transmise telle quelle au job publish (pas de rebuild).
      # Inutile pour une pull request : rien n'y est publié.
      - name: Export de l'image testée
        if: github.event_name != 'pull_request'
        run: docker save app:ci | gzip -1 > image.tar.gz

      - name: Transmission de l'image au job publish
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.app }}
          path: image.tar.gz
          compression-level: 0   # déjà compressée
          retention-days: 1

  # ---------- Publication de l'image testée ----------
  # Porte unique vers GHCR : tests, scan des secrets et smoke test doivent tous être verts
  publish:
    name: Publication GHCR - ${{ matrix.app }}
    needs: [changes, test, secrets-scan, build]
    if: needs.changes.outputs.matrix != '[]' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write        # push vers ghcr.io avec le GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      APP_DIR: ${{ matrix.app }}
      IMAGE_NAME: ${{ github.repository }}/${{ matrix.app }}
    steps:
      - name: Récupération de l'image testée
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.app }}

      - name: Chargement de l'image
        run: gunzip -c image.tar.gz | docker load

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags : <branche>-<sha court> (ex. main-1a2b3c4), <branche>, et latest sur la branche par défaut
      - name: Calcul des tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # Même image (même identifiant) que celle validée par le smoke test, sous chaque tag
      - name: Push de l'image vers GHCR
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag app:ci "$tag"
            docker push "$tag"
          done

      - name: Résumé
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Image publiée : ${APP_DIR}"
            echo "Identifiant de l'image testée : \`$(docker image inspect --format '{{.Id}}' app:ci)\`"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
