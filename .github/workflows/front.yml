name: CI - Front Olympic Games (Angular)

on:
  push:
    branches: ["**"]
    paths:
      - "olympic-games-starter/**"
      - "run-tests.sh"
      - ".github/workflows/front.yml"
  pull_request:
    branches: [main]
    paths:
      - "olympic-games-starter/**"
      - "run-tests.sh"
      - ".github/workflows/front.yml"
  workflow_dispatch:

# Paramètres centralisés pour rendre le workflow facilement configurable
env:
  APP_DIR: olympic-games-starter
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/olympic-games-starter   # mis en minuscules par metadata-action
  GITLEAKS_VERSION: "8.24.0"
  NODE_VERSION: "22"                      # Angular 20 requiert Node ^20.19 || ^22.12
  CONTAINER_PORT: "80"                    # port exposé par Nginx dans l'image
  SMOKE_PORT: "8080"                      # port local utilisé pour le test de l'image

permissions:
  contents: read

jobs:
  # ---------- Étape 2 : tests unitaires + rapport JUnit ----------
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write          # publication du rapport JUnit dans l'onglet Checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Exécution des tests (Karma / ChromeHeadless)
        run: |
          chmod +x ./run-tests.sh
          ./run-tests.sh "$APP_DIR"

      - name: Publication du rapport JUnit
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: test-results/**/*.xml
          check_name: Rapport JUnit - Angular

      - name: Archivage des rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-angular
          path: test-results/

  # ---------- Sécurité : détection de secrets dans le code et l'historique (TS-04) ----------
  secrets-scan:
    name: Scan des secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installation de Gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Échoue (code de sortie 1) si un secret est détecté ; faux positifs marqués « gitleaks:allow »
      - name: Analyse Gitleaks
        run: gitleaks git . --redact --verbose --no-banner --report-format json --report-path gitleaks-report.json

      - name: Archivage du rapport Gitleaks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-front
          path: gitleaks-report.json
          if-no-files-found: ignore

  # ---------- Étape 3 : build, validation et publication de l'image ----------
  build:
    name: Build & push Docker (GHCR)
    needs: [test, secrets-scan]   # pas de publication si un test ou le scan échoue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push vers ghcr.io avec le GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags : <branche>-<sha court> (ex. main-1a2b3c4), <branche>, et latest sur la branche par défaut
      - name: Calcul des tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-,format=short,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      # 1) Build chargé dans le démon Docker local pour pouvoir le tester avant publication
      - name: Build de l'image (locale)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          load: true
          tags: app:ci
          cache-from: type=gha,scope=front
          cache-to: type=gha,mode=max,scope=front

      # 2) Validation : l'image démarre et Nginx sert bien l'application Angular
      - name: Test de l'image (smoke test)
        run: |
          docker run -d --name smoke -p ${SMOKE_PORT}:${CONTAINER_PORT} app:ci
          for i in $(seq 1 15); do
            if curl -fsS "http://localhost:${SMOKE_PORT}/" | grep -q "<app-root"; then
              echo "Application servie correctement"
              exit 0
            fi
            sleep 2
          done
          echo "L'application ne répond pas" >&2
          docker logs smoke
          exit 1

      - name: Arrêt du conteneur de test
        if: always()
        run: docker rm -f smoke || true

      # 3) Publication : réutilise le cache du build précédent (pas de rebuild complet)
      - name: Push de l'image vers GHCR
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=front

      - name: Résumé
        if: github.event_name != 'pull_request'
        run: |
          echo "### Image publiée" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
