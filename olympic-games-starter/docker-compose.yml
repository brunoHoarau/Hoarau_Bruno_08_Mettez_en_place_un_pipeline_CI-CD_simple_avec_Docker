services:
  olympic-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: olympic-games-starter:latest
    container_name: olympic-games-starter
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 et non localhost : dans l'image, localhost résout en ::1 alors que Nginx n'écoute qu'en IPv4
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Rotation des logs Docker : 3 fichiers de 10 Mo maximum
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
