services:
  olympic-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: olympic-games-starter:latest
    container_name: olympic-games-starter
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
